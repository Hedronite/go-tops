# Go-TOPS gating its own repository (GO_TOPS.md §17).
#
# The kit runs `advisory` until the laws layer lands at M5 (GO_TOPS.md §6.7): the
# 16 required laws stay `not-evaluated`, and a required law that is not
# evaluated fails the gate (§3.3), so a `hard` run would be red by construction.
# The kit's CI holds the gates that exist to the bar anyway: it fails unless
# hygiene, tests, coverage and CRAP are `pass`, mutation is `skip` with an
# unexpired `expires`, and every required law is `not-evaluated` for `no_reader`
# (.github/workflows/ci.yml, "assert the report"). CRAP has been on since M2: every
# function meets the cap, but the two exemptions at the end of this file. At M5
# this file switches to `enforce: hard` and the `advisory` key goes.
protocol: "0.4.5"
version: "0.1.0"
module: github.com/Hedronite/go-tops
class: binary-cli
enforce: advisory

advisory:
  reason: the laws layer, which judges the 16 required laws, lands at M5
  owner: "@VirtualMachinist"
  expires: "2027-03-31"

toolchain:
  go_floor: "1.26"
  go_current: "1.27"
  cgo: false                 # builds and releases; test jobs run with cgo for -race

gates:
  hygiene:
    golangci_lint: { config: .golangci.yml }
    govulncheck:   { fail_on: reachable }
    deps:          { depguard: true, licenses: { allow: [MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC] } }
  tests:
    race: true
    shuffle: true
    count: 1
  coverage:
    statements_floor: 70
    exclude_generated: true
  crap:
    cap: 10
  mutation:
    enabled: false
    reason: the mutation layer lands at M4
    expires: "2027-03-01"

layers:
  fuzz:  { targets: ["./internal/config:FuzzLoad"] }
  bench: { enabled: false, reason: "binary-cli does not gate benchmarks" }

# Exemptions (GO_TOPS.md section 6.8). Every kit function meets the CRAP cap
# except these two, which the ratchet hook changed at M2 and the laws layer
# reworks at M5. Each expires on or before the M5 date, the expiry of the
# advisory record above.
exemptions:
  - path: internal/gate/run.go
    symbol: Execute
    layer: crap
    reason: already over the cap; split with the M5 laws work
    owner: maintainer
    expires: "2027-03-31"
  - path: internal/gate/run.go
    symbol: assemble
    layer: crap
    reason: already over the cap; split with the M5 laws work
    owner: maintainer
    expires: "2027-03-31"
