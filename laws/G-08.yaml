reader: analyzer
rationale: >
  time.Sleep in tests hides races and flakes CI; the synctest analyzer replaces wall-clock waits.
fix: >
  Use synctest.Test or channels with a clear happens-before; delete time.Sleep used only to wait for goroutines.
