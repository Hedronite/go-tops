- workspace-root
reader: tool
rationale: >
  Copied mutexes and sync types are undefined behavior; govet copylocks reports them.
fix: >
  Pass pointers to sync primitives, or use a single owning struct; never copy a mutex, WaitGroup, or channel value after first use.
v01: true
