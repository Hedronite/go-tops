id: G-02
title: '`wg.Add` is never called inside the goroutine it counts'
severity: refuse
status: active
classes:
- library-core
- binary-cli
- tui-app
- binary-service
- concurrency-runtime
- library-util
- parser-codec
- unsafe-kernel
- cgo-bridge
- codegen
- embedded-tinygo
- workspace-root
reader: tool
rationale: >
  Calling wg.Add inside the goroutine races with Wait and can under-count; govet's waitgroup analyzer flags it.
fix: >
  Call wg.Add before the go statement that uses the WaitGroup, with a comment naming the owning goroutine and how it exits.
v01: true
tool: govet
