# Go-TOPS configuration (GO_TOPS.md §9), written by gotops init.
protocol: "0.4.7"
version: "0.1.0"
module: github.com/Hedronite/go-tops/poire/go
class: library-core
# The exemplars carry no legacy debt, so they are gated as hard as the protocol
# allows today. Until the laws layer lands at M5, every required law is
# not-evaluated, which fails a hard run by construction (GO_TOPS.md §3.3), so
# this instance runs advisory, as the kit's own does. The evidence of record is
# a hard run in which every other layer passes (Go-POIRE 0.2, §0.3).
enforce: advisory          # hard | ratchet | advisory (§6.7)
advisory:
  reason: the laws layer, which judges the 16 required laws, lands at M5
  owner: "@VirtualMachinist"
  expires: "2027-03-31"
baseline: .go-tops/baseline.json

toolchain:
  go_floor: "1.27"
  go_current: "1.27"
  cgo: false

gates:
  hygiene:
    golangci_lint: { config: .go-tops/golangci.yml }
    govulncheck:   { fail_on: reachable }
    deps:          { depguard: true, licenses: { allow: [MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC] } }
  tests:
    race: true
    shuffle: true
    count: 1
  coverage:
    statements_floor: 85
    exclude_generated: true
  crap:
    enabled: true
    cap: 8
    complexity: { err_guard_discount: true, wrap_functions: [] }
  mutation:
    enabled: true
    unexplained_survivors_max: 0
    ledger: .go-tops/survivors.yaml

layers:
  fuzz:   { enabled: false, reason: "tier 2 layers land at M6", targets: [] }
  stress: { enabled: false, reason: "tier 2 layers land at M6" }
  bench:  { enabled: false, reason: "tier 2 layers land at M6", regression_pct: 5 }

laws:
  ack_ledger: .go-tops/acks.yaml

report:
  path: .go-tops/report.json
