# Go-TOPS configuration (GO_TOPS.md §9), written by gotops init.
protocol: "0.4.6"
version: "0.1.0"
module: github.com/acme/demo
class: binary-cli
enforce: ratchet           # hard | ratchet | advisory (§6.7)
baseline: .go-tops/baseline.json

toolchain:
  go_floor: "1.26"
  go_current: "1.27"
  cgo: false

gates:
  hygiene:
    golangci_lint: { config: .go-tops/golangci.yml }
    govulncheck:   { fail_on: reachable }
    deps:          { depguard: true, licenses: { allow: [MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC] } }
  tests:
    race: true
    shuffle: true
    count: 1
  coverage:
    statements_floor: 70
    exclude_generated: true
  crap:
    enabled: true
    cap: 10
    complexity: { err_guard_discount: true, wrap_functions: [] }
  mutation:
    enabled: true
    unexplained_survivors_max: 0
    ledger: .go-tops/survivors.yaml

layers:
  fuzz:   { enabled: false, reason: "tier 2 layers land at M6", targets: [] }
  stress: { enabled: false, reason: "tier 2 layers land at M6" }
  bench:  { enabled: false, reason: "binary-cli does not gate benchmarks" }

laws:
  ack_ledger: .go-tops/acks.yaml

report:
  path: .go-tops/report.json
