# Style only (GO_TOPS.md §8.1): no Go-TOPS law reads this file. The errcheck
# settings match the law pass, so the editor and the gate agree.
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: deprecated since Go 1.16; use os and io
            - pkg: github.com/pkg/errors
              desc: archived; use errors and fmt.Errorf with %w
    errcheck:
      check-blank: true
      check-type-assertions: true
      exclude-functions:
        - (io.ReadCloser).Close

formatters:
  enable:
    - gofmt
