# Go-TOPS configuration (GO_TOPS.md §9), written by gotops init.
protocol: "{PROTOCOL}"
version: "0.1.0"
module: {MODULE}
class: {CLASS}
enforce: {ENFORCE}           # hard | ratchet | advisory (§6.7)
baseline: .go-tops/baseline.json

toolchain:
  go_floor: "{GO_FLOOR}"
  go_current: "{GO_CURRENT}"
  cgo: false

gates:
  hygiene:
    golangci_lint: { config: .golangci.yml }
    govulncheck:   { fail_on: reachable }
    deps:          { depguard: {DEPGUARD}, licenses: { allow: [MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC] } }
  tests:
    race: true
    shuffle: true
    count: 1
  coverage:
    statements_floor: {COVERAGE_FLOOR}
    exclude_generated: true
  crap:
    enabled: false
    reason: "native CRAP lands at M2 of the kit"
    expires: "{EXPIRES_M2}"
    cap: {CRAP_CAP}
    complexity: { err_guard_discount: true, wrap_functions: [] }
  mutation:
    enabled: false
    reason: "mutation lands at M4 of the kit"
    expires: "{EXPIRES_M4}"
    unexplained_survivors_max: 0
    ledger: .go-tops/survivors.yaml

layers:
{LAYERS}

laws:
  ack_ledger: .go-tops/acks.yaml

report:
  path: .go-tops/report.json
