name: go-tops

# The Go-TOPS drop-in (GO_TOPS.md §11): one job that runs the gate. Every action
# is pinned by commit SHA (the comment names the release), and the job only reads.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-tops-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: ubuntu, os: ubuntu-latest, go: "{TOOLCHAIN_NUM}" }
          - { leg: macos, os: macos-latest, go: "{TOOLCHAIN_NUM}" }
          - { leg: floor, os: ubuntu-latest, go: "{GO_FLOOR}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # setup-go installs the latest release of the floor language version; this
      # step proves the floor leg runs it and not another toolchain.
      - name: toolchain is the floor release
        if: matrix.leg == 'floor'
        run: |
          set -euo pipefail
          got="$(go env GOVERSION)"
          echo "GOVERSION=${got}"
          case "${got}" in
            go{GO_FLOOR}|go{GO_FLOOR}.*) ;;
            *) echo "::error::the floor leg runs ${got}, not a go{GO_FLOOR} release"; exit 1 ;;
          esac
      # The gate leg: gotops runs every layer and fails the job on a red gate.
      - name: gate
        if: matrix.leg != 'floor'
        env:
          GOTOOLCHAIN: local
        run: go tool -modfile=tools/go.mod gotops gate
      # The floor leg builds and tests on the floor toolchain. The gate itself
      # runs on the other legs: a narrowed gate run leaves laws out of range.
      - name: build and test on the floor
        if: matrix.leg == 'floor'
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "1"
        run: |
          go build ./...
          go test -race -shuffle=on -count=1 ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.leg != 'floor'
        with:
          name: go-tops-${{ matrix.leg }}
          path: .go-tops/
          if-no-files-found: warn
