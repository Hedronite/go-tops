version: "2"

run:
  relative-path-mode: gomod

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    - govet
    - errorlint
    - errcheck
    - noctx
    - contextcheck
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - gosec
  settings:
    govet:
      disable-all: true
      enable:
        - waitgroup
        - copylocks
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    errcheck:
      check-blank: true
      check-type-assertions: true
      exclude-functions:
        - (io.ReadCloser).Close
    gosec:
      includes:
        - G401
        - G404
        - G501
        - G505
