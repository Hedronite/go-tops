name: ci

# Go-TOPS gating itself: the one `gate` job of GO_TOPS.md §11. Read-only;
# superseded runs are cancelled; every action is pinned by commit SHA (the
# comment names the release). One aggregate job, `ci`, needs the rest: it is the
# check a ruleset on main requires. The docs workflow (docs.yml) is separate and
# stays as it is.
#
# The kit runs `enforce: advisory` until the laws layer lands at M5 (§6.7), so the
# gate exits 0 whatever it finds. The step "assert the report" is what holds the
# kit to the bar until then: see go-tops.yaml.
#
# Two kinds of run. A push or a pull request runs the gate and the aggregate `ci`.
# A weekly schedule, or a manual dispatch, runs only the `adoption` job: the end
# to end test of the adoption path (GO_TOPS.md section 6.7), which needs the
# network and takes minutes, so it does not belong on every push. Every job says
# which events it runs on. The `skills` job runs the tests of the agent skills,
# which need Nushell, on both platforms of every push and pull request. The
# `bootstrap` job proves the drop-in's first-ledger route on ubuntu-latest. The
# `mutation` job runs the weak/strong/uncovered fixture suite across platforms.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A push or a pull request supersedes an older run of its own kind. A scheduled
# or dispatched run has a group of its own, and is never cancelled: it would
# otherwise share the group of a push to main and be cancelled by it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && 'dispatch' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  # The exact release go-tops.lock pins: the gate compares `go env GOVERSION` with
  # it, so a new release is a reviewed change to the lock and to this line.
  CURRENT_GO: "1.27.4"
  # The latest 1.26 patch release: the `go 1.26` line names a language version,
  # not a release (GO_TOPS.md §2, §11).
  FLOOR_GO: "1.26.11"

jobs:
  gate:
    name: gate (${{ matrix.name }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            floor: false
            lint_platform: linux-amd64
          # macOS is a required leg: Darwin differs from Linux in cgo, paths and the
          # toolchain (GO_TOPS.md §11). macos-latest runners are arm64.
          - name: macos
            os: macos-latest
            floor: false
            lint_platform: darwin-arm64
          # The language-floor leg: the module must still build and pass its tests on
          # the oldest supported toolchain. It builds and tests directly, because a
          # gate pinned to the current release cannot judge the floor and `--only
          # tests` would end `partial`, which CI refuses (GO_TOPS.md §11).
          - name: floor
            os: ubuntu-latest
            floor: true
            lint_platform: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      # fetch-depth 0: the mutation diff needs history (GO_TOPS.md §6.4).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # setup-go sets GOTOOLCHAIN=local, so the go command runs exactly the release
      # installed here and never switches.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.floor && env.FLOOR_GO || env.CURRENT_GO }}
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # golangci-lint is installed before anything that runs the tests, on every leg:
      # the hygiene tests run the real tool, and a test that ends tool-missing proves
      # nothing. The tarball is checked against the SHA-256 pinned below (the same
      # value as go-tops.lock's `sha256` for the platform), and the gate checks the
      # installed executable against the lock's `executable_sha256` before it runs
      # it, so a wrong file is a lock mismatch, not a quiet pass. The tool is found
      # on PATH (GO_TOPS.md §10); a bump is a new hash here and a new lock entry.
      - name: install golangci-lint v2.15.0
        env:
          VERSION: 2.15.0
          PLATFORM: ${{ matrix.lint_platform }}
        run: |
          set -euo pipefail
          case "${PLATFORM}" in
            linux-amd64)  sha=9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea ;;
            darwin-arm64) sha=d1e409481a8ca846c4bc97e781eb5cb1bd5c23353a0b3977a1cbda1b1b6447d5 ;;
            *) echo "::error::no pinned hash for ${PLATFORM}"; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/golangci-lint.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/golangci/golangci-lint/releases/download/v${VERSION}/golangci-lint-${VERSION}-${PLATFORM}.tar.gz"
          echo "${sha}  ${archive}" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/golangci-lint"
          tar -xzf "${archive}" --strip-components=1 -C "${RUNNER_TEMP}/golangci-lint"
          echo "${RUNNER_TEMP}/golangci-lint" >> "${GITHUB_PATH}"
      - name: golangci-lint version
        run: golangci-lint version

      # --- the language-floor leg ---
      - name: toolchain is the floor release
        if: ${{ matrix.floor }}
        run: |
          set -euo pipefail
          got="$(go env GOVERSION)"
          echo "GOVERSION=${got}"
          test "${got}" = "go${FLOOR_GO}"
      - name: floor build
        if: ${{ matrix.floor }}
        run: go build ./...
      - name: floor test
        if: ${{ matrix.floor }}
        env:
          CGO_ENABLED: "1"
        run: go test -race -shuffle=on -count=1 ./...

      # --- the full gate legs ---
      # The kit gates the code in this checkout, so it runs it with `go run`: no
      # tag of go-tops exists to pin, and tools/go.mod holds the module tools the
      # gate runs (gotestsum, govulncheck, go-licenses), not gotops itself. An
      # adopter runs the pinned build, `go tool -modfile=tools/go.mod gotops gate`
      # (GO_TOPS.md §11).
      - name: gotops gate
        if: ${{ !matrix.floor }}
        run: go run ./cmd/gotops gate
      # Always: the report and the saved lint and coverage output are what you read
      # when the gate or the assertion below is red. Hidden files are off by default.
      - name: upload .go-tops
        if: ${{ always() && !matrix.floor }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-tops-${{ matrix.name }}
          path: |
            .go-tops/
            !.go-tops/bin/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      # The bootstrap rule of GO_TOPS.md §6.7 and §17: the gate exits 0 under
      # advisory, so this step reads the report and fails unless
      #   - hygiene, tests, coverage and crap are `pass`;
      #   - mutation is `pass` or `vacuous` (never `skip`);
      #   - G5 (M5): all 16 v0.1 laws judged and the laws layer passes (none `no_reader`;
      #     G-11 and G-16 allow on kit under advisory).
      #   - the run is reported as not enforced, and every enabled layer ran.
      # To plant a failure locally, change .go-tops/report.json and run this step's
      # script from the repository root.
      - name: assert the report
        if: ${{ !matrix.floor }}
        shell: bash
        run: |
          set -euo pipefail
          test -s .go-tops/report.json
          problems="$(jq -r '
            def layer($id): [.layers[] | select(.id == $id)] | if length == 1 then .[0] else null end;
            [
              ( ("hygiene", "tests", "coverage", "crap") as $id
                | layer($id) as $l
                | select($l == null or $l.outcome != "pass")
                | "\($id): outcome \($l.outcome // "absent"), want pass" ),
              ( "mutation" as $id
                | layer($id) as $l
                | select($l == null or ($l.outcome != "pass" and $l.outcome != "vacuous"))
                | "\($id): outcome \($l.outcome // "absent"), want pass or vacuous" ),
              ( select((.laws.judged // 0) != 16)
                | "laws: judged \(.laws.judged // 0), want 16 in release G3" ),
              ( select(.laws.required_not_evaluated != 0)
                | "laws: required_not_evaluated \(.laws.required_not_evaluated), want 0 (G3)" ),
              ( (.laws.results // [])[] as $r
                | select( ($r.id | test("^G-(02|07|08|11|12|16|17|18|19|25|26|33|34|37|38|40)$"))
                  and (($r.verdict | IN("allow","refuse")) | not) )
                | "law \($r.id): \($r.verdict) \($r.reason // ""), want allow or refuse (G3)" ),
              ( (.laws.results // [])[] as $r
                | select( ($r.id | test("^G-(02|07|08|11|12|16|17|18|19|25|26|33|34|37|38|40)$"))
                  and ($r.reason // "") == "no_reader" )
                | "law \($r.id): still no_reader, want a tier-1 judgment (G3)" ),
              ( layer("laws") as $l
                | select($l == null or $l.outcome != "pass")
                | "laws: outcome \($l.outcome // "absent"), want pass (G5)" ),
              ( select((.summary.failed // []) | index("laws"))
                | "summary.failed includes laws, want laws layer pass (G5)" ),
              ( select(.summary.enforced != false)
                | "summary.enforced is \(.summary.enforced), want false under advisory" ),
              ( select(.enforce != "advisory")
                | "enforce is \(.enforce), want advisory" ),
              ( select(.layer_counts.ran != .layer_counts.enabled_in_range)
                | "layers: \(.layer_counts.ran) ran of \(.layer_counts.enabled_in_range) enabled in range" )
            ] | .[]' .go-tops/report.json)"
          if [ -n "${problems}" ]; then
            while IFS= read -r line; do echo "::error::${line}"; done <<< "${problems}"
            exit 1
          fi
          echo "report assertion: ok"

  # The agent skills (.agents/skills, build tag `skills`): each is a Nushell script
  # that wraps gotops and prints one JSON object. The tests run them against a
  # stand-in gotops and doctored reports, and hold the go-tops-gate skill to the
  # drop-in's judge. They need Nushell and fail without it, so the plain
  # `go test ./...` of every other job needs none. Nushell is the release archive
  # of the version the Rust-TOPS skills are pinned to, checked against its SHA-256
  # (the value in the release's SHA256SUMS).
  skills:
    name: skills (${{ matrix.name }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            nu_target: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-latest
            nu_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.CURRENT_GO }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: install Nushell 0.108.0
        env:
          VERSION: 0.108.0
          TARGET: ${{ matrix.nu_target }}
        run: |
          set -euo pipefail
          case "${TARGET}" in
            x86_64-unknown-linux-gnu) sha=f0daaa0256b0f7dd5f4d9925b4d5522d8de5e947ed9ad64a43526e5cffeb05df ;;
            aarch64-apple-darwin)     sha=21a11b4eb804f4bb7ce67bb18d90d227824d271e19e9f88da15733691888b916 ;;
            *) echo "::error::no pinned hash for ${TARGET}"; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/nu.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/nushell/nushell/releases/download/${VERSION}/nu-${VERSION}-${TARGET}.tar.gz"
          echo "${sha}  ${archive}" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/nu"
          tar -xzf "${archive}" --strip-components=1 -C "${RUNNER_TEMP}/nu"
          echo "${RUNNER_TEMP}/nu" >> "${GITHUB_PATH}"
      - name: tool versions
        run: |
          set -euo pipefail
          test "$(nu --version)" = "0.108.0"
          jq --version
          git --version
      # The log must show the tests that matter passing: a run that found none, or
      # one that skipped them, is a failure and not a pass.
      - name: skill tests
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/skills.log"
          go test -v -tags skills -count=1 -timeout 15m . ./internal/initcmd 2>&1 | tee "${log}"
          for name in TestGateSkillJudgesTheReportUnderC9 TestAdoptSkillRunsInitBaselineAndCheck TestReviewDiffListsEachTouchedFunctionWithItsRatchetState TestTheGateSkillAndTheDropInJudgeAgreeOnEveryCase TestSkillMirrorsAreByteIdentical; do
            if ! grep -q -- "--- PASS: ${name} " "${log}"; then
              echo "::error::no '--- PASS' line for ${name}: the test did not run, or it was skipped"
              exit 1
            fi
          done

  # The first-ledger bootstrap of the drop-in (internal/initcmd/bootstrap_ci_test.go,
  # build tag `bootstrap`), run on the runner the ledger leg uses. The test adopts a
  # scratch module with this pull request's gotops and runs the template's own steps
  # as a pull_request, each step's `if` evaluated for that event: with no ledger the
  # ubuntu leg writes one on linux/amd64 and uploads it and the run fails; the ledger
  # is committed as uploaded and the next run passes with the ratchet judged; a
  # ledger planted for another build fails the judge. It reads the network and runs
  # the template's golangci-lint install step for real, so the linter is not
  # installed here. The log must show the test passing: a run that found none, or
  # one that skipped it, is a failure.
  bootstrap:
    name: bootstrap (ubuntu)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.CURRENT_GO }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: tool versions
        run: |
          set -euo pipefail
          jq --version
          git --version
      - name: first-ledger bootstrap
        env:
          CGO_ENABLED: "1"
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/bootstrap.log"
          go test -v -tags bootstrap -run TestFirstLedger -timeout 20m -count=1 ./internal/initcmd 2>&1 | tee "${log}"
          if ! grep -q -- "--- PASS: TestFirstLedgerBootstrapOnAPullRequest " "${log}"; then
            echo "::error::no '--- PASS' line for TestFirstLedgerBootstrapOnAPullRequest: the test did not run, or it was skipped"
            exit 1
          fi

  mutation:
    name: mutation (${{ matrix.name }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.CURRENT_GO }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: mutation fixture tests
        env:
          CGO_ENABLED: "1"
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/mutation.log"
          go test -v -tags mutation -run TestMutationFixtureWeakStrongAndUncovered -timeout 15m -count=1 ./cmd/gotops 2>&1 | tee "${log}"
          if ! grep -q -- "--- PASS: TestMutationFixtureWeakStrongAndUncovered " "${log}"; then
            echo "::error::no '--- PASS' line for TestMutationFixtureWeakStrongAndUncovered: the test did not run, or it was skipped"
            exit 1
          fi

  ci:
    name: ci
    # Runs even when a dependency failed, was skipped or was cancelled, and
    # fails unless every one of them succeeded: a skipped job must not pass. It
    # runs on the events the gate runs on; a scheduled or dispatched run has no
    # gate to wait for.
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    needs: [gate, skills, bootstrap, mutation]
    runs-on: ubuntu-latest
    steps:
      - name: every ci job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a ci job ended ${r}, not success"
              exit 1
            fi
          done

  # The adoption path, end to end, with the real binary (cmd/gotops/adoption_test.go,
  # build tag `adoption`): init into a legacy module, baseline --init, check, the
  # ratchet judging the first ledger, then a change that raises a function and one
  # that lowers it, for a module at the root of the repository and in a
  # subdirectory. It reads the network (init tidies tools/go.mod, the hygiene layer
  # reads the vulnerability database), so it runs weekly and on demand, never on a
  # push. A failure here is a regression in what an adopter does first.
  #
  # Owner: maintainer. GitHub turns a scheduled workflow off after 60 days with no
  # activity in the repository; a quiet repo must run this job by hand
  # (workflow_dispatch), or push, to switch the schedule back on. It fails closed:
  # it needs the log to show both layouts passing, so a skipped test (no linter on
  # PATH) or a run that found no test is a failure, never a pass.
  adoption:
    name: adoption
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: adoption-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.CURRENT_GO }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The same pinned linter as the gate job, checked against the same SHA-256.
      - name: install golangci-lint v2.15.0
        env:
          VERSION: 2.15.0
        run: |
          set -euo pipefail
          sha=9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
          archive="${RUNNER_TEMP}/golangci-lint.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/golangci/golangci-lint/releases/download/v${VERSION}/golangci-lint-${VERSION}-linux-amd64.tar.gz"
          echo "${sha}  ${archive}" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/golangci-lint"
          tar -xzf "${archive}" --strip-components=1 -C "${RUNNER_TEMP}/golangci-lint"
          echo "${RUNNER_TEMP}/golangci-lint" >> "${GITHUB_PATH}"
      # The drop-in's judging step, which the test runs on each real report, reads
      # it with jq.
      - name: jq version
        run: jq --version
      # The pinned Nushell of the skills job, for the live skills test below.
      - name: install Nushell 0.108.0
        env:
          VERSION: 0.108.0
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          sha=f0daaa0256b0f7dd5f4d9925b4d5522d8de5e947ed9ad64a43526e5cffeb05df
          archive="${RUNNER_TEMP}/nu.tar.gz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/nushell/nushell/releases/download/${VERSION}/nu-${VERSION}-${TARGET}.tar.gz"
          echo "${sha}  ${archive}" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/nu"
          tar -xzf "${archive}" --strip-components=1 -C "${RUNNER_TEMP}/nu"
          echo "${RUNNER_TEMP}/nu" >> "${GITHUB_PATH}"
      - name: adoption end to end
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/adoption.log"
          go test -v -tags adoption -run TestAdoption -timeout 20m -count=1 ./cmd/gotops 2>&1 | tee "${log}"
          for layout in module_at_the_root module_in_mod; do
            if ! grep -q -- "--- PASS: TestAdoptionOfALegacyRepo/${layout}" "${log}"; then
              echo "::error::no '--- PASS' line for TestAdoptionOfALegacyRepo/${layout}: the test did not run, or it was skipped"
              exit 1
            fi
          done
      # The skills against the real gotops and linter, on a fixture module
      # (skills_live_test.go): the skills job runs them on fixtures only.
      - name: skills against the real gotops
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/skills-live.log"
          go test -v -tags "skills adoption" -run TestSkillsRun -timeout 20m -count=1 . 2>&1 | tee "${log}"
          if ! grep -q -- "--- PASS: TestSkillsRunTheRealGotopsOnAFixtureModule " "${log}"; then
            echo "::error::no '--- PASS' line for TestSkillsRunTheRealGotopsOnAFixtureModule: the test did not run, or it was skipped"
            exit 1
          fi
